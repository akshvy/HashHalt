<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HashHalt — Your image never leaves your device</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
    :root{
    --bg:#F5F6F1;
    --bg-alt:#ECEEE4;
    --card:#FFFFFF;
    --ink:#16213A;
    --ink-soft:#4B5566;
    --ink-faint:#8A93A3;
    --teal:#3A6B63;
    --teal-deep:#233F3A;
    --teal-pale:#E4ECE9;
    --gold:#C79A3C;
    --alert:#A6493C;
    --line:#DCDED4;
    --radius:14px;
    --serif:'Fraunces', serif;
    --sans:'Inter', sans-serif;
    --mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  img{max-width:100%;display:block;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 28px;}
  h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.08;margin:0;letter-spacing:-0.01em;}
  .eyebrow{
    font-family:var(--mono);
    font-size:12.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--teal);
    display:flex;align-items:center;gap:10px;
    margin-bottom:14px;
  }
  .eyebrow::before{content:'';width:22px;height:1px;background:var(--teal);display:inline-block;}
  :focus-visible{outline:2.5px solid var(--gold);outline-offset:3px;}

   /* ---------- NAV ---------- */
  header.site{
    position:sticky;top:0;z-index:50;
    background:rgba(245,246,241,.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .nav{display:flex;align-items:center;justify-content:space-between;padding:16px 0;}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:600;font-size:21px;}
  .brand .mark{width:30px;height:30px;flex:none;}
  .navlinks{display:flex;align-items:center;gap:30px;font-size:14.5px;font-weight:500;}
  .navlinks a{text-decoration:none;color:var(--ink-soft);transition:color .15s;}
  .navlinks a:hover{color:var(--teal);}
  .lang-switch{display:flex;gap:2px;background:var(--bg-alt);border-radius:20px;padding:3px;font-family:var(--mono);font-size:12px;}
  .lang-switch button{
    border:none;background:transparent;padding:6px 12px;border-radius:16px;cursor:pointer;
    color:var(--ink-soft);font-family:var(--mono);font-size:12px;letter-spacing:.03em;
  }
  .lang-switch button.active{background:var(--ink);color:#fff;}
  .nav-cta{
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:9px;
    font-size:13.5px;font-weight:600;text-decoration:none;white-space:nowrap;
  }
  @media(max-width:880px){ .navlinks{display:none;} }

  /* ---------- HERO ---------- */
  .hero{padding:76px 0 60px;}
  .hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;}
  @media(max-width:960px){.hero-grid{grid-template-columns:1fr;}}
  .hero h1{font-size:clamp(34px,4.6vw,58px);}
  .hero h1 em{font-style:normal;color:var(--teal);}
  .hero p.lead{font-size:18px;color:var(--ink-soft);max-width:46ch;margin-top:18px;}
  .hero-actions{display:flex;gap:14px;margin-top:30px;flex-wrap:wrap;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:9px;
    font-weight:600;font-size:14.5px;text-decoration:none;cursor:pointer;border:1px solid transparent;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-primary:hover{box-shadow:0 8px 20px -8px rgba(58,107,99,.55);}
  .btn-ghost{background:transparent;color:var(--ink);border-color:var(--line);}
  .btn-ghost:hover{border-color:var(--ink);}
  .trust-row{display:flex;gap:26px;margin-top:34px;flex-wrap:wrap;}
  .trust-row .item{font-size:12.5px;color:var(--ink-faint);font-family:var(--mono);display:flex;gap:7px;align-items:center;}
  .trust-row .dot{width:6px;height:6px;border-radius:50%;background:var(--teal);}

  /* ---- signature: live hashing demo ---- */
  .hash-demo{
    background:var(--ink);
    border-radius:20px;
    padding:26px;
    color:#fff;
    position:relative;
    overflow:hidden;
  }
  .hash-demo::before{
    content:'';position:absolute;inset:0;
    background:radial-gradient(600px 300px at 90% -10%, rgba(58,107,99,.55), transparent 60%);
    pointer-events:none;
  }
  .hash-demo .hd-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;position:relative;}
  .hd-head .tag{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#9FB3AD;}
  .drop{
    border:1.5px dashed rgba(255,255,255,.3);
    border-radius:14px;
    padding:26px;
    text-align:center;
    cursor:pointer;
    position:relative;
    transition:border-color .15s, background .15s;
    min-height:190px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  }
  .drop.dragover{border-color:var(--gold);background:rgba(199,154,60,.08);}
  .drop canvas{border-radius:10px;max-height:130px;max-width:100%;}
  .drop p{margin:0;font-size:13.5px;color:#C7CDD6;}
  .drop input{display:none;}
  .drop .up-icon{width:34px;height:34px;color:#9FB3AD;}
  .hash-output{
    margin-top:16px;font-family:var(--mono);font-size:12.5px;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
    border-radius:10px;padding:14px;line-height:1.7;word-break:break-all;color:#B9E0D4;
    min-height:20px;
  }
  .hash-output .lbl{color:#7C8AA0;display:inline-block;width:112px;}
  .hd-note{font-size:12px;color:#8892A3;margin-top:12px;line-height:1.6;}
   /* ---------- SECTION shared ---------- */
  section{padding:88px 0;}
  section.alt{background:var(--bg-alt);}
  .section-head{max-width:640px;margin-bottom:52px;}
  .section-head h2{font-size:clamp(26px,3.2vw,38px);}
  .section-head p{color:var(--ink-soft);margin-top:14px;font-size:16px;}

  /* ---------- HOW IT WORKS (sequence — numbers earned) ---------- */
  .steps{display:grid;grid-template-columns:repeat(5,1fr);gap:0;position:relative;}
  @media(max-width:980px){.steps{grid-template-columns:1fr 1fr;}}
  @media(max-width:600px){.steps{grid-template-columns:1fr;}}
  .step{padding:0 18px 0 0;position:relative;}
  .step .num{
    font-family:var(--serif);font-size:34px;color:var(--teal);
    border-bottom:2px solid var(--line);padding-bottom:14px;margin-bottom:16px;
  }
  .step h4{font-size:16px;margin-bottom:8px;}
  .step p{font-size:13.8px;color:var(--ink-soft);margin:0;}

  /* ---------- LAYERS ---------- */
  .layers{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;}
  @media(max-width:820px){.layers{grid-template-columns:1fr;}}
  .layer-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:30px;
  }
  .layer-card .lc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;}
  .layer-card .lc-tag{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);letter-spacing:.06em;}
  .layer-card h3{font-size:20px;margin-bottom:10px;}
  .layer-card p{color:var(--ink-soft);font-size:14.5px;margin:0 0 16px;}
  .layer-card ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;}
  .layer-card li{font-size:13px;font-family:var(--mono);color:var(--teal-deep);padding-left:16px;position:relative;}
  .layer-card li::before{content:'—';position:absolute;left:0;color:var(--gold);}
  .status-pill{font-size:11px;font-family:var(--mono);padding:4px 10px;border-radius:20px;background:var(--teal-pale);color:var(--teal-deep);white-space:nowrap;}

  /* ---------- LIVE PROTOTYPE PANEL ---------- */
  .proto-panel{
    background:var(--ink);border-radius:20px;padding:44px;color:#fff;
    display:grid;grid-template-columns:1fr 1fr;gap:44px;
  }
  @media(max-width:900px){.proto-panel{grid-template-columns:1fr;padding:28px;}}
  .proto-col h3{color:#fff;font-size:19px;margin-bottom:10px;}
  .proto-col p.desc{color:#AEB6C4;font-size:13.8px;margin-bottom:20px;}
  .meter-wrap{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:20px;}
  .meter-bar{height:8px;background:rgba(255,255,255,.12);border-radius:6px;overflow:hidden;margin:14px 0 8px;}
  .meter-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--gold));width:0%;transition:width .8s ease;}
  .meter-label{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:#C7CDD6;}
  .btn-light{background:#fff;color:var(--ink);}
  .btn-light:hover{box-shadow:0 8px 20px -8px rgba(255,255,255,.3);}
  .pdf-log{font-family:var(--mono);font-size:11.5px;color:#9FB3AD;margin-top:14px;line-height:1.8;min-height:20px;}
  .demo-flag{
    display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--gold);border:1px solid rgba(199,154,60,.4);padding:3px 9px;border-radius:20px;margin-bottom:14px;
  }
/* ---------- MULTILINGUAL ---------- */
  .lang-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:50px;align-items:center;}
  @media(max-width:900px){.lang-grid{grid-template-columns:1fr;}}
  .lang-card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px;
  }
  .lang-preview-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .lang-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;}
  .lang-chip{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:20px;padding:6px 12px;color:var(--ink-soft);}
  #lang-preview-title{font-size:22px;margin-bottom:6px;}
  #lang-preview-body{color:var(--ink-soft);font-size:14.5px;}
