<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HashHalt — Your image never leaves your device</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
    :root{
    --bg:#F5F6F1;
    --bg-alt:#ECEEE4;
    --card:#FFFFFF;
    --ink:#16213A;
    --ink-soft:#4B5566;
    --ink-faint:#8A93A3;
    --teal:#3A6B63;
    --teal-deep:#233F3A;
    --teal-pale:#E4ECE9;
    --gold:#C79A3C;
    --alert:#A6493C;
    --line:#DCDED4;
    --radius:14px;
    --serif:'Fraunces', serif;
    --sans:'Inter', sans-serif;
    --mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  img{max-width:100%;display:block;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 28px;}
  h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.08;margin:0;letter-spacing:-0.01em;}
  .eyebrow{
    font-family:var(--mono);
    font-size:12.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--teal);
    display:flex;align-items:center;gap:10px;
    margin-bottom:14px;
  }
  .eyebrow::before{content:'';width:22px;height:1px;background:var(--teal);display:inline-block;}
  :focus-visible{outline:2.5px solid var(--gold);outline-offset:3px;}

   /* ---------- NAV ---------- */
  header.site{
    position:sticky;top:0;z-index:50;
    background:rgba(245,246,241,.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .nav{display:flex;align-items:center;justify-content:space-between;padding:16px 0;}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:600;font-size:21px;}
  .brand .mark{width:30px;height:30px;flex:none;}
  .navlinks{display:flex;align-items:center;gap:30px;font-size:14.5px;font-weight:500;}
  .navlinks a{text-decoration:none;color:var(--ink-soft);transition:color .15s;}
  .navlinks a:hover{color:var(--teal);}
  .lang-switch{display:flex;gap:2px;background:var(--bg-alt);border-radius:20px;padding:3px;font-family:var(--mono);font-size:12px;}
  .lang-switch button{
    border:none;background:transparent;padding:6px 12px;border-radius:16px;cursor:pointer;
    color:var(--ink-soft);font-family:var(--mono);font-size:12px;letter-spacing:.03em;
  }
  .lang-switch button.active{background:var(--ink);color:#fff;}
  .nav-cta{
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:9px;
    font-size:13.5px;font-weight:600;text-decoration:none;white-space:nowrap;
  }
  @media(max-width:880px){ .navlinks{display:none;} }
