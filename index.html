<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HashHalt — Your image never leaves your device</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
    :root{
    --bg:#F5F6F1;
    --bg-alt:#ECEEE4;
    --card:#FFFFFF;
    --ink:#16213A;
    --ink-soft:#4B5566;
    --ink-faint:#8A93A3;
    --teal:#3A6B63;
    --teal-deep:#233F3A;
    --teal-pale:#E4ECE9;
    --gold:#C79A3C;
    --alert:#A6493C;
    --line:#DCDED4;
    --radius:14px;
    --serif:'Fraunces', serif;
    --sans:'Inter', sans-serif;
    --mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  img{max-width:100%;display:block;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 28px;}
  h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.08;margin:0;letter-spacing:-0.01em;}
  .eyebrow{
    font-family:var(--mono);
    font-size:12.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--teal);
    display:flex;align-items:center;gap:10px;
    margin-bottom:14px;
  }
